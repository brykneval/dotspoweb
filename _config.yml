description: "DotsPo merges mesmerizing dot-connecting gameplay with the inspiring life journeys of Steve Jobs, Nikola Tesla, Marie Curie, and more. Connect colorful paths, collect authentic historical artifacts, and lose yourself in soothing soundscapes."
baseurl: "" # the subpath of your site, e.g. /blog
