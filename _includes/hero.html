<section class="hero-section" id="hero">
  <div class="hero-bg-glow"></div>

  <div class="container hero-container">
    <div class="hero-content">
      <div class="hero-app-intro">
        <img src="{{ '/assets/images/icon.png' | relative_url }}" alt="DotsPo App Icon" class="hero-app-icon" width="64"
          height="64">
      </div>

      <h1 class="hero-title">
        DotsPo<br>
        <span class="gradient-text">Connecting Dots.</span>
      </h1>

      <p class="hero-subtitle">
        Its cannot be as easy as connecting dots.
      </p>

      <div class="hero-cta-group" id="download">
        <div class="app-store-badges">
          <a href="#" class="store-badge" title="Download on the App Store">
            <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.8c.64-.81 1.08-1.93.96-3.05-1 .04-2.19.67-2.88 1.48-.61.71-1.14 1.86-1 2.96 1.12.09 2.27-.58 2.92-1.39z" />
            </svg>
            <div class="badge-text">
              <span class="badge-small">Download on the</span>
              <span class="badge-large">App Store</span>
            </div>
          </a>

          <a href="#" class="store-badge" title="Get it on Google Play">
            <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3.609 1.814L13.793 12 3.61 22.186c-.36-.296-.61-.762-.61-1.309V3.123c0-.547.25-1.013.61-1.309zm11.258 11.258l2.086 2.086-11.78 6.801 9.694-8.887zm0-2.144L5.173 2.041l11.78 6.801-2.086 2.086zm1.464 1.072l3.435 1.984c.732.423.732 1.115 0 1.538l-3.435 1.984-1.89-1.89 1.89-1.616z" />
            </svg>
            <div class="badge-text">
              <span class="badge-small">Get it on</span>
              <span class="badge-large">Google Play</span>
            </div>
          </a>
        </div>
      </div>

      <div class="hero-stats">
        <div class="stat-item">
          <span class="stat-number">3</span>
          <span class="stat-label">Game Modes</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number">350+</span>
          <span class="stat-label">Crafted Levels</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number">100%</span>
          <span class="stat-label">Ad-Free Sanctuary</span>
        </div>
      </div>
    </div>

    <div class="hero-visual">
      <!-- Minimalist Device Mockup -->
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen phone-screen-image">
          <img src="{{ '/assets/images/screenshot.png' | relative_url }}" alt="DotsPo App Screenshot"
            class="phone-screenshot-img" loading="eager">
        </div>

        <!-- Floating Achievement Card -->
        <div class="floating-card floating-clue">
          <div class="clue-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
              </path>
            </svg>
          </div>
          <div>
            <div class="clue-meta">Clue Discovered</div>
            <div class="clue-title">The 1976 Apple I Board</div>
          </div>
        </div>

        <!-- Floating Multiplier Card -->
        <div class="floating-card floating-combo">
          <span class="combo-pill">2X Rush</span>
          <span class="combo-text">Harmonic Loop!</span>
        </div>
      </div>
    </div>
  </div>
</section>
